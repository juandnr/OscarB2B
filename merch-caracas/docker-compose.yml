# Servidor de Merch Caracas: Postgres + n8n + Caddy (HTTPS automático).
# Toda la configuración sale de .env (lo llena deploy/preparar.sh).
# Guía paso a paso: deploy/INSTALAR.md

name: merch-caracas

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      # Base de n8n; la del sistema ("merch") la crea deploy/postgres-init.
      POSTGRES_DB: n8n
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.3
    restart: unless-stopped
    # Los flujos leen su configuración (HubSpot, Claude, horario...) con $env.
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-merch}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en .env}
      N8N_HOST: ${N8N_DOMINIO:?Falta N8N_DOMINIO en .env}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_DOMINIO}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Caracas}
      TZ: ${TIMEZONE:-America/Caracas}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Borra ejecuciones de más de 14 días para que la base no crezca sin fin.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_datos:/home/node/.n8n
      - ./n8n/workflows:/flujos:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMINIO: ${N8N_DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - n8n

  # Para correr los scripts sin instalar Node en el servidor:
  #   docker compose run --rm herramientas npm run db:migrar
  herramientas:
    image: node:22-alpine
    profiles: ["herramientas"]
    working_dir: /app
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_datos:
  n8n_datos:
  caddy_datos:
  caddy_config:
